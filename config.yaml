experiment:
  name: dinov2_vits14_baseline
  description: DINOv2 ViT-S/14
model:
  backbone_name: dinov2_vits14
  embedding_dim: 128
  pretrained: true
  use_attention: false
  freeze_backbone: false
  projection_head:
    hidden_dims:
    - 256
    - 256
    use_batch_norm: true
    dropout: 0.15
    normalize_embeddings_ln: true
    use_hardtanh: false
    hardtanh_min: -2.0
    hardtanh_max: 2.0
data:
  train_dir: data/processed/train
  val_dir: data/processed/val
  test_dir: data/processed/test
  annotation_root: data/annotations
  classes_per_batch: 8
  samples_per_class: 2
  batch_size: 16
  val_batch_size: 2
  auto_tune_resources: true
  num_workers: 10
  prefetch_factor: 4
  val_num_workers: 2
  worker_ram_budget_mb: 20570
  pin_memory: true
  loader_policy:
    exclusive_train_workers_during_val: false
    persistent_workers: true
  drop_last: true
  image_size: 504
  resize_size: 504
augmentation:
  performance_mode: true
  random_horizontal_flip: 0.5
  random_vertical_flip: 0.5
  random_rotation: 180
  random_crop: false
  color_jitter:
    brightness: 0.8
    contrast: 0.8
    saturation: 0.1
    hue: 0.15
  grayscale:
    enabled: false
    p: 1.0
  microscopy_specific:
    random_gamma:
      enabled: true
      gamma_limit:
      - 80
      - 120
      p: 0.5
    gaussian_noise:
      enabled: true
      var_limit:
      - 10.0
      - 50.0
      p: 0.5
    blur:
      enabled: true
      blur_limit: 3
      p: 0.3
    optical_distortion:
      enabled: false
      distort_limit: 0.1
      p: 0.3
    clahe:
      enabled: true
      clip_limit: 2.0
      tile_grid_size:
      - 8
      - 8
      p: 0.5
  domain_augmentation:
    enabled: true
    brightness_contrast_limit: 0.4
    rgb_shift_limit: 25
    tone_curve_scale: 0.2
    downscale_min: 0.2
    coarse_dropout_holes: 4
  normalize:
    mean:
    - 0.485
    - 0.456
    - 0.406
    std:
    - 0.229
    - 0.224
    - 0.225
training:
  epochs: 10
  warmup_epochs: 3
  gradient_accumulation_steps: 4
  loss:
    type: sliced_ms
    params:
      num_slices: 4
      alpha: 1.0
      beta: 50.0
      base_margin: 0.5
      margin: 28.6
      scale: 64.0
      proxy_scale: 30.0
      proxy_margin: 0.2
  validation_metric: recall_at_1
  mining:
    enabled: false
    type: semihard
    margin: 0.2
  hard_mining:
    enabled: false
    ratio: 0.5
    min_samples: 32
    warmup_epochs: 3
    adaptive: false
  optimizer: adamw
  learning_rate: 0.0001
  weight_decay: 0.01
  backbone_lr_factor: 0.1
  scheduler: cosine
  scheduler_params:
    T_max: 10
    eta_min: 1.0e-06
  gradient_clip_norm: 5.0
  early_stopping:
    enabled: true
    patience: 20
    min_delta: 0.001
    restore_best_weights: true
  save_every_n_epochs: 9
  save_best_only: true
sota:
  uniformity:
    enabled: false
    lambda: 1.0
    t: 2.0
  decorrelation:
    enabled: false
    lambda: 10.0
    target_variance: 1.0
    var_weight: 0.0
    cov_weight: 1.0
  disentanglement:
    enabled: false
    lambda: 5.0
    weight: 1.0
  amplitude_penalty:
    enabled: false
    lambda_weight: 0.1
    penalty_type: clamping
    margin: 0.5
  nir:
    enabled: false
    lambda: 0.5
    eps: 0.0001
  hier:
    enabled: false
    lambda: 0.1
    num_levels: 3
    temperature: 0.1
  dada:
    enabled: false
    lambda: 0.1
    kernel_bandwidth: 1.0
  self_distillation:
    enabled: false
    ema_alpha: 0.999
    temperature: 0.1
    lambda: 0.5
  embedding_space: euclidean
  hyperbolic_curvature: 1.0
  augmentation_mode: full
grain_detection:
  enabled: true
  model_type: u2netp
  input_size: 320
  saliency_threshold: 0.3
  adaptive_k: 0.3
  min_area: 1000
  max_area: 120000
  morph_kernel_size: 3
  min_circularity: 0.3
  crop_padding: 0.2
  crop_size: 504
  use_mask: true
  masked_pooling: true
  image_cache_size: 32
  image_cache_max_mb: 512
  max_cached_image_mb: 32
  max_load_side: 512
  distance_threshold: 0.7
  train_mask_bg_mode: gray
  val_mask_bg_mode: gray
logging:
  tensorboard:
    enabled: true
    log_dir: runs
  wandb:
    enabled: false
    project: metric-learning
    entity: null
  log_level: INFO
  log_interval: 10
paths:
  model_save_dir: models
  checkpoint_dir: models/checkpoints
  log_dir: logs
  experiment_dir: experiments
hardware:
  use_gpu: true
  gpu_ids:
  - 0
  use_amp: true
  distributed: false
  world_size: 1
  faiss_gpu: true
evaluation:
  progressive_plot_every_epochs: 2
  compute_precision_at_k:
  - 1
  - 5
  - 10
  visualize_embeddings: true
  embedding_visualization_method: tsne
reproducibility:
  seed: 42
  deterministic: false
  benchmark: true
inference:
  index_type: flat
  metric_type: inner_product
  k_neighbors: 5
  use_gpu: false
  similarity_threshold: 0.6
  confidence_threshold: 0.8
  device: cuda
