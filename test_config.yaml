augmentation:
  color_jitter:
    brightness: 0.8
    contrast: 0.8
    hue: 0.15
    saturation: 0.1
  domain_augmentation:
    brightness_contrast_limit: 0.4
    coarse_dropout_holes: 4
    downscale_min: 0.2
    enabled: true
    rgb_shift_limit: 25
    tone_curve_scale: 0.2
  grayscale:
    enabled: false
    p: 1.0
  microscopy_specific:
    blur:
      blur_limit: 3
      enabled: true
      p: 0.3
    clahe:
      clip_limit: 2.0
      enabled: true
      p: 0.5
      tile_grid_size:
      - 8
      - 8
    gaussian_noise:
      enabled: true
      p: 0.5
      var_limit:
      - 10.0
      - 50.0
    optical_distortion:
      distort_limit: 0.1
      enabled: false
      p: 0.3
    random_gamma:
      enabled: true
      gamma_limit:
      - 80
      - 120
      p: 0.5
  normalize:
    mean:
    - 0.485
    - 0.456
    - 0.406
    std:
    - 0.229
    - 0.224
    - 0.225
  performance_mode: false
  random_crop: false
  random_horizontal_flip: 0.5
  random_rotation: 180
  random_vertical_flip: 0.5
data:
  annotation_root: data/annotations
  auto_tune_resources: true
  batch_size: 64
  classes_per_batch: 8
  drop_last: true
  image_size: 504
  loader_policy:
    exclusive_train_workers_during_val: false
    persistent_workers: true
  num_workers: 6
  pin_memory: true
  prefetch_factor: 4
  resize_size: 504
  samples_per_class: 8
  test_dir: data/processed/test
  train_dir: data/processed/train
  val_batch_size: 64
  val_dir: data/processed/val
  val_num_workers: 0
  worker_ram_budget_mb: 6000
evaluation:
  compute_precision_at_k:
  - 1
  - 5
  - 10
  embedding_visualization_method: tsne
  progressive_plot_every_epochs: 2
  visualize_embeddings: true
experiment:
  description: DINOv2 ViT-S/14 — smoke test sliced_ms (1 epoch)
  name: dinov2_vits14_sliced_ms_test
grain_detection:
  adaptive_k: 0.3
  crop_padding: 0.2
  crop_size: 252
  distance_threshold: 0.7
  enabled: true
  image_cache_max_mb: 96
  image_cache_size: 6
  input_size: 320
  masked_pooling: true
  max_area: 120000
  max_cached_image_mb: 32
  max_load_side: 512
  min_area: 1000
  min_circularity: 0.3
  model_type: u2netp
  morph_kernel_size: 3
  saliency_threshold: 0.3
  train_mask_bg_mode: random
  use_mask: true
  val_mask_bg_mode: gray
hardware:
  distributed: false
  faiss_gpu: true
  gpu_ids:
  - 0
  use_amp: true
  use_gpu: true
  world_size: 1
inference:
  confidence_threshold: 0.8
  device: cuda
  index_type: flat
  k_neighbors: 5
  metric_type: inner_product
  similarity_threshold: 0.6
  use_gpu: false
logging:
  log_interval: 10
  log_level: INFO
  tensorboard:
    enabled: true
    log_dir: runs
  wandb:
    enabled: false
    entity: null
    project: metric-learning
model:
  backbone_name: dinov2_vits14
  embedding_dim: 128
  freeze_backbone: true
  pretrained: true
  pooling:
    strategy: multi_spectral
    layers: [3, 11]
    statistics: [mean, max, std]
    masked:
      enabled: true
      threshold: 0.01
      weighting: soft
    drop_token:
      enabled: false
      prob: 0.0
      eval_mode: "off"
    norm_intermediate: true
    layer_fusion: per_layer
  projection:
    layout: multi_tower
    slice_layer_map: [11, 11, 3, 3]
  projection_head:
    dropout: 0.1
    hardtanh_max: 2.0
    hardtanh_min: -2.0
    hidden_dims:
    - 256
    - 256
    normalize_embeddings_ln: true
    use_batch_norm: true
    use_hardtanh: false
  use_attention: false
paths:
  checkpoint_dir: models/checkpoints
  experiment_dir: experiments
  log_dir: logs
  model_save_dir: models
reproducibility:
  benchmark: true
  deterministic: false
  seed: 42
sota:
  amplitude_penalty:
    enabled: false
    lambda_weight: 0.1
    margin: 0.5
    penalty_type: clamping
  augmentation_mode: full
  dada:
    enabled: false
    kernel_bandwidth: 1.0
    lambda: 0.1
  decorrelation:
    cov_weight: 1.0
    enabled: false
    lambda: 10.0
    target_variance: 1.0
    var_weight: 0.0
  disentanglement:
    enabled: false
    lambda: 5.0
    weight: 1.0
  embedding_space: euclidean
  hier:
    enabled: false
    lambda: 0.1
    num_levels: 3
    temperature: 0.1
  hyperbolic_curvature: 1.0
  nir:
    enabled: false
    eps: 0.0001
    lambda: 0.5
  self_distillation:
    ema_alpha: 0.999
    enabled: false
    lambda: 0.5
    temperature: 0.1
  uniformity:
    enabled: false
    lambda: 1.0
    t: 2.0
training:
  backbone_lr_factor: 0.1
  early_stopping:
    enabled: true
    min_delta: 0.001
    patience: 20
    restore_best_weights: true
  epochs: 1
  gradient_accumulation_steps: 1
  gradient_clip_norm: 5.0
  hard_mining:
    adaptive: false
    enabled: false
    min_samples: 32
    ratio: 0.5
    warmup_epochs: 3
  learning_rate: 0.0005
  loss:
    params:
      alpha: 2.0
      beta: 50.0
      base_margin: 0.5
      num_slices: 4
    type: sliced_ms
  mining:
    enabled: false
    margin: 0.2
    type: semihard
  optimizer: adamw
  save_best_only: true
  save_every_n_epochs: 9
  scheduler: cosine
  scheduler_params:
    T_max: 10
    eta_min: 1.0e-06
  validation_metric: recall_at_1
  warmup_epochs: 3
  weight_decay: 0.01
